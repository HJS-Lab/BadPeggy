image: maven:3.9-eclipse-temurin-17

stages:
  - build
  - release

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --errors --fail-at-end"
  SWT_ARTIFACT: "org.eclipse.swt.win32.win32.x86_64"

cache:
  key: maven-cache
  paths:
    - .m2/repository

build-jar:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile -Dswt.artifactId=$SWT_ARTIFACT
    - mvn $MAVEN_CLI_OPTS package -DskipTests -Dswt.artifactId=$SWT_ARTIFACT -Dswt.os=win32 -Dswt.arch=x86_64
  artifacts:
    paths:
      - target/*-standalone.jar
    expire_in: 30 days

create-release:
  stage: release
  when: manual
  script:
    - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
    - echo "Downloading Windows JDK for cross-compilation..."
    - wget -q "https://api.adoptium.net/v3/binary/latest/17/ga/windows/x64/jdk/hotspot/normal/eclipse" -O windows-jdk.zip
    - unzip -q windows-jdk.zip -d windows-jdk-extracted
    - export WIN_JDK_JMODS=$(find windows-jdk-extracted -name "jmods" -type d | head -1)
    - echo "Windows JDK jmods found at $WIN_JDK_JMODS"
    - echo "Creating custom Windows JRE with jlink..."
    - jlink --module-path "$WIN_JDK_JMODS" --add-modules java.base,java.desktop,java.logging,java.prefs --strip-debug --no-man-pages --no-header-files --compress=2 --output jre-custom
    - du -sh jre-custom
    - mkdir -p "Bad Peggy"
    - cp target/badpeggy-*-standalone.jar "Bad Peggy/badpeggy.jar"
    - cp -r jre-custom "Bad Peggy/jre"
    - cp etc/images/badpeggy.ico "Bad Peggy/" 2>/dev/null || true
    - cp etc/scripts/install.vbs "Bad Peggy/" 2>/dev/null || true
    - cp LICENSE.txt "Bad Peggy/" 2>/dev/null || true
    - cp etc/README.txt "Bad Peggy/" 2>/dev/null || true
    - cp etc/LIESMICH.txt "Bad Peggy/" 2>/dev/null || true
    - printf '@echo off\r\ncd /d "%%~dp0"\r\nstart "" "jre\\bin\\javaw.exe" -jar badpeggy.jar\r\n' > "Bad Peggy/BadPeggy.cmd"
    - ls -la "Bad Peggy/"
  artifacts:
    name: "BadPeggy-Windows-x64"
    paths:
      - Bad Peggy/
    expire_in: 30 days
  needs:
    - build-jar
